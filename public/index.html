<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<title>BEAN-HOARDER — 원두 조회</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cellipse cx='24' cy='24' rx='14' ry='19' fill='%23f04e1c' transform='rotate(20 24 24)'/%3E%3Cpath d='M18 8C28 18 20 30 30 40' stroke='%23ffffff' stroke-width='4' fill='none' transform='rotate(20 24 24)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/theme.css">

<style>
  body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh; padding: 22px 16px 32px; }
  main { width: 100%; max-width: 430px; flex: 1; }
  .brand {
    display: inline-block; font-family: var(--display); font-weight: 700; font-size: 12px;
    letter-spacing: .22em; color: var(--sub); text-decoration: none; margin: 0 0 14px 2px;
  }
  footer { margin-top: 28px; font-size: 11px; letter-spacing: .08em; color: var(--sub); }

  /* ---- 보딩패스 카드 ---- */
  .pass {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    border-top: 6px solid var(--accent); overflow: hidden;
  }
  .pass-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 22px 0;
  }
  .pass-brand {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .2em; color: var(--sub);
  }
  .pass-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .pass-key { font-family: var(--mono); font-size: 12.5px; font-weight: 700; letter-spacing: .06em; }

  .pass-main { padding: 18px 22px 22px; }
  .preview-badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px;
  }
  .eyebrow {
    font-size: 11.5px; font-weight: 700; letter-spacing: .2em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
  }
  h1.origin {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(32px, 9vw, 42px); line-height: 1.02;
    letter-spacing: .01em; text-transform: uppercase; text-wrap: balance;
  }
  .subline { margin: 8px 0 0; font-size: 14px; color: var(--sub); font-weight: 500; }
  .subline .sep { padding: 0 5px; }

  ul.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; }
  ul.chips li {
    font-size: 12.5px; font-weight: 600; padding: 3.5px 11px; border-radius: var(--radius-pill);
    border: 1px solid var(--ink); color: var(--ink);
  }
  .note { margin: 16px 0 0; font-style: italic; font-size: 14px; }

  dl.specs { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 18px; margin: 20px 0 0; }
  dl.specs > div { display: flex; flex-direction: column; min-width: 0; }
  dt { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--sub); }
  dd { margin: 2px 0 0; font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }

  /* 절취선 + 노치 */
  .perf { position: relative; height: 22px; }
  .perf::before { content: ""; position: absolute; left: 26px; right: 26px; top: 10px; border-top: 2px dashed var(--line); }
  .perf i { position: absolute; top: 1px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
  .perf i:first-child { left: -10px; }
  .perf i:last-child { right: -10px; }

  .pass-stub { padding: 4px 22px 20px; }
  .stub-grid { display: flex; align-items: center; gap: 22px; margin: 0; }
  .stub-grid > div { display: flex; flex-direction: column; }
  .stub-grid dd { margin: 2px 0 0; font-family: var(--mono); font-size: 13.5px; font-weight: 700; }
  .dday {
    margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); border-radius: var(--radius-pill); padding: 3px 11px;
  }
  .memo { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .memo-label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--sub); margin-bottom: 3px; }
  .memo-body { font-size: 13.5px; }
  .srcline { margin-top: 14px; font-size: 12.5px; }
  .srcline a { font-weight: 600; text-decoration: none; }
  .srcline a:hover { text-decoration: underline; }

  /* ---- 상태 / 랜딩 ---- */
  .status { text-align: center; padding: 52px 22px; color: var(--sub); font-size: 14px; }
  .status .code { font-family: var(--mono); color: var(--ink); }

  .landing { text-align: center; padding: 40px 26px 32px; border-top: 6px solid var(--accent); border-left: 0; border-right: 0; border-bottom: 0; }
  .beanmark { width: 42px; height: 42px; color: var(--accent); margin-bottom: 10px; }
  .landing h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .01em; }
  .landing .tagline { margin: 10px 0 22px; font-size: 14px; color: var(--sub); }
  #code-form { display: flex; gap: 8px; }
  #code-form input { font-family: var(--mono); text-transform: uppercase; }
  #code-form button { white-space: nowrap; flex-shrink: 0; }
  .landing-links { margin-top: 18px; font-size: 13px; color: var(--sub); }
  .landing-links a { text-decoration: none; font-weight: 600; }
  .landing-links a:hover { text-decoration: underline; }

  /* ---- 카메라 QR 스캔 ---- */
  .scan-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    margin-top: 10px; width: 100%; padding: 11px 14px;
    border: 1px solid var(--accent); color: var(--accent); background: var(--surface);
    border-radius: 11px; font-size: 14px; font-weight: 600;
  }
  .scan-btn:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .scanner {
    position: fixed; inset: 0; z-index: 1000; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .scanner-inner { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #scan-video { width: 100%; height: 100%; object-fit: cover; }
  .scan-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(66vw, 260px); aspect-ratio: 1; border-radius: 18px;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5); border: 2px solid rgba(255, 255, 255, .9);
  }
  .scan-hint {
    position: absolute; left: 0; right: 0; bottom: 92px; text-align: center;
    color: #fff; font-size: 14px; padding: 0 24px; text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .scan-close {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: var(--radius-pill); padding: 10px 22px; font-size: 14px; font-weight: 600; backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
<main>
  <a class="brand" href="/" id="top-brand">BEAN-HOARDER</a>

  <div id="status" class="card status">불러오는 중…</div>

  <div id="landing" class="card landing hidden">
    <svg class="beanmark" viewBox="0 0 48 48" aria-hidden="true">
      <ellipse cx="24" cy="24" rx="14" ry="19" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(20 24 24)"/>

    <form id="code-form">

        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/>
      </svg>
      카메라로 QR 스캔
    </button>

<footer>BEAN-HOARDER — 원두 소분 라벨 아카이브</footer>

<script>
const KEY_RE = /^[A-Z0-9]{4}\d{2}-\d{3}$/;
// 지역·생산자는 서브라인, 날짜·용량은 하단 스텁에 표시하므로 스펙 그리드에서 제외
const SPEC_FIELDS = [
  ["PROCESS", "PROCESS"], ["VARIETY", "VARIETY"], ["AGTRON", "ROAST PT"],
  ["ALTITUDE", "ALTITUDE"], ["HARVEST", "HARVEST"], ["LOT", "LOT"], ["WASHING_STATION", "WASH STN"],
];

function getCode() {
  const q = new URLSearchParams(location.search).get("c");
  if (q) return q.trim().toUpperCase();
  const path = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "");
  return path && path !== "index.html" ? path.toUpperCase() : null;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function hideAll() {
  ["status", "landing", "bean"].forEach(id => document.getElementById(id).classList.add("hidden"));
}
function show(msg) {
  hideAll();
  const el = document.getElementById("status");
  el.innerHTML = msg;
  el.classList.remove("hidden");
}
function showLanding() {
  hideAll();
  document.getElementById("landing").classList.remove("hidden");
  document.getElementById("top-brand").classList.add("hidden");
  document.getElementById("code-form").addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("code-input").value.trim().toUpperCase();
    if (v) location.href = "/" + encodeURIComponent(v);
  });
  setupScanner();
}

// ── 카메라 QR 스캔 ──
// 스캔된 QR은 라벨 URL(HTTPS://BNHD.PAGES.DEV/{KEY})이므로 KEY만 뽑아 이동한다.
function keyFromScan(data) {
  if (!data) return null;
  let s = data.trim();
  try { const u = new URL(s); s = new URLSearchParams(u.search).get("c") || u.pathname; } catch (e) { /* URL 아니면 원문 */ }
  s = s.replace(/^\/+|\/+$/g, "").toUpperCase();
  return KEY_RE.test(s) ? s : null;
}

function setupScanner() {
  const btn = document.getElementById("scan-btn");
  // 카메라(getUserMedia)를 쓸 수 있고 안전 컨텍스트일 때만 버튼 노출
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || typeof jsQR !== "function") return;
  btn.classList.remove("hidden");

  const scanner = document.getElementById("scanner");
  const video = document.getElementById("scan-video");
  const canvas = document.getElementById("scan-canvas");
  const hint = document.getElementById("scan-hint");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  let stream = null, raf = 0;

  async function open() {
    scanner.classList.remove("hidden");
    hint.textContent = "카메라를 준비하는 중…";
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    } catch (e) {
      hint.textContent = "카메라를 열 수 없습니다. 권한을 허용했는지 확인해 주세요.";
      return;
    }
    video.srcObject = stream;
    await video.play().catch(() => {});
    hint.textContent = "라벨의 QR을 사각형 안에 맞춰 주세요";
    raf = requestAnimationFrame(tick);
  }
  function close() {
    cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    scanner.classList.add("hidden");
  }
  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const result = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
      const key = result && keyFromScan(result.data);
      if (key) {
        hint.textContent = `${key} 조회 중…`;
        close();
        location.href = "/" + encodeURIComponent(key);
        return;
      }
      if (result) hint.textContent = "이 QR은 Bean-Hoarder 라벨이 아닙니다.";
    }
    raf = requestAnimationFrame(tick);
  }
  btn.addEventListener("click", open);
  document.getElementById("scan-close").addEventListener("click", close);
}

function parseDot(d) {
  const m = /^(\d{2})\.(\d{2})\.(\d{2})$/.exec(d || "");
  return m ? new Date(2000 + +m[1], +m[2] - 1, +m[3]) : null;
}

function render(row, isPreview) {
  const g = k => (row[k] || "").trim();
  hideAll();
  document.getElementById("bean").classList.remove("hidden");
  document.getElementById("top-brand").classList.add("hidden");  // 패스 헤더에 브랜드가 있으므로 중복 제거

  const badge = document.getElementById("f-preview-badge");
  badge.classList.toggle("hidden", !isPreview);
  if (isPreview) badge.textContent = "초안 미리보기 · 아직 등록되지 않음";

  document.getElementById("f-key").textContent = g("KEY");
  document.getElementById("f-roastery").textContent = g("ROASTERY");
  // 메인 식별자: 국가+세부지역 조합(또는 시그니쳐/블렌드명). 라벨·카드와 동일 규칙(headline.js).
  const usedInHead = typeof bhHeadlineUsedFields === "function" ? bhHeadlineUsedFields(row) : [];
  const headline = (typeof bhHeadline === "function" ? bhHeadline(row) : g("ORIGIN")) || g("KEY");
  document.getElementById("f-origin").textContent = headline;

  // 산지별 색상 코딩: 상단 스트립을 산지 해시 색으로 (라벨 물리 인쇄 색과는 무관, 조회 화면 전용)
  const originColor = typeof bhOriginColor === "function" ? bhOriginColor(g("ORIGIN")) : null;
  document.getElementById("bean").style.borderTopColor = originColor || "";

  // 시그니쳐명일 땐 국가를 서브라인에 보존, 헤드라인이 이미 쓴 지역·생산자는 제외(중복 방지)
  const subParts = [];
  if (g("COFFEE_NAME") && g("ORIGIN")) subParts.push(g("ORIGIN"));
  for (const k of ["REGION", "PRODUCER"]) {
    if (!usedInHead.includes(k) && g(k)) subParts.push(g(k));
  }
  const sub = document.getElementById("f-subline");
  sub.classList.toggle("hidden", !subParts.length);
  sub.innerHTML = subParts.map(v => `<span>${escapeHtml(v)}</span>`).join('<span class="sep">·</span>');

  // 테이스팅 노트: 짧은 항목들이면 칩으로, 긴 문장이면 이탤릭 문단으로
  const chips = document.getElementById("f-chips");
  const note = document.getElementById("f-note");
  chips.classList.add("hidden"); note.classList.add("hidden");
  const noteRaw = g("TASTING_NOTE");
  if (noteRaw) {
    const segs = noteRaw.split(/[,·]/).map(s => s.trim()).filter(Boolean);
    if (segs.length && segs.every(s => s.length <= 28)) {
      chips.innerHTML = segs.map(s => `<li>${escapeHtml(s)}</li>`).join("");
      chips.classList.remove("hidden");
    } else {
      note.textContent = noteRaw;
      note.classList.remove("hidden");
    }
  }

  const dl = document.getElementById("f-specs");
  dl.innerHTML = "";
  for (const [col, label] of SPEC_FIELDS) {
    if (usedInHead.includes(col)) continue; // 헤드라인에 이미 표시된 필드(워싱스테이션·랏)는 제외
    const v = g(col);
    if (!v) continue;
    const div = document.createElement("div");
    div.innerHTML = `<dt>${label}</dt><dd>${escapeHtml(v)}</dd>`;
    dl.appendChild(div);
  }

  // 스텁: 로스팅/소분/용량 + D+N
  const setStub = (boxId, valId, v) => {
    document.getElementById(boxId).classList.toggle("hidden", !v);
    if (v) document.getElementById(valId).textContent = v;
  };
  const rd = g("ROAST_DATE");
  setStub("f-roasted-box", "f-roasted", rd);
  setStub("f-packed-box", "f-packed", g("PACKAGE_DATE"));
  setStub("f-net-box", "f-net", g("NET_WEIGHT"));
  const dday = document.getElementById("f-dday");
  const d = parseDot(rd);
  const n = d ? Math.floor((Date.now() - d.getTime()) / 864e5) : null;
  const showDday = n != null && n >= 0 && !isPreview;
  dday.classList.toggle("hidden", !showDday);
  if (showDday) dday.textContent = `D+${n}`;

  const memo = document.getElementById("f-memo");
  memo.classList.toggle("hidden", !g("MEMO"));
  if (g("MEMO")) document.getElementById("f-memo-body").textContent = g("MEMO");

  document.getElementById("f-srcline").classList.toggle("hidden", !g("SOURCE_URL"));
  if (g("SOURCE_URL")) document.getElementById("f-source").href = g("SOURCE_URL");

  document.title = `${headline} — BEAN-HOARDER${isPreview ? " (미리보기)" : ""}`;
}

function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split("").map(c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join(""));
}

async function main() {
  const previewParam = new URLSearchParams(location.search).get("preview");
  if (previewParam) {
    try {
      render(JSON.parse(b64DecodeUnicode(previewParam)), true);
    } catch (e) {
      show("미리보기 데이터를 해석하지 못했습니다.");
    }
    return;
  }
  const code = getCode();
  if (!code) { showLanding(); return; }
  if (!KEY_RE.test(code)) {
    show(`올바른 코드 형식이 아닙니다.<br><span class="code">${escapeHtml(code)}</span><br><br><a href="/">처음으로 ←</a>`);
    return;
  }
  let res;
  try {
    res = await fetch(`/api/bean/${encodeURIComponent(code)}`, { cache: "no-store" });
  } catch (e) {
    show("데이터를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.");
    return;
  }
  if (res.status === 404) {
    show(`등록되지 않은 코드입니다.<br><span class="code">${escapeHtml(code)}</span><br><br><a href="/">처음으로 ←</a>`);
    return;
  }
  if (!res.ok) {
    show("데이터를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.");
    return;
  }
  const { bean } = await res.json();
  render(bean, false);
}
main();
</script>
</body>
</html>
