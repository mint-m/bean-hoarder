name: deploy

# 배포는 main이 아니라 별도 deploy 브랜치 전용 — main에 머지된다고 자동으로 라이브에 반영되지 않는다.
# 배포하려면 main → deploy 로 병합(PR 권장)하거나 workflow_dispatch로 수동 실행.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # --branch=main 고정: 실제 체크아웃 브랜치는 'deploy'지만, 이걸 안 주면 wrangler가
      # 그 브랜치명을 그대로 Cloudflare Pages 브랜치로 써서 deploy.bnhd.pages.dev라는
      # 프리뷰 별칭에만 올라가고 프로덕션 루트 도메인은 갱신되지 않는다.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          command: pages deploy public --project-name=bnhd --branch=main
