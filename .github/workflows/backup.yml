name: backup

# 프로덕션 D1 자동 백업 — 매일 04:17 KST (19:17 UTC) SQL 덤프를 GitHub Actions
# artifact(비공개 리포, 30일 보관)로 남긴다. 복구 절차는 README 운영 섹션 참고.
# 참고: D1 자체의 Time Travel(30일 시점 복구)이 1차 안전망이고 이 덤프는 오프사이트 2차 백업.
# 기존 CLOUDFLARE_API_TOKEN에 D1 읽기(편집) 권한이 없으면 이 잡이 실패한다 —
# 그 경우 토큰에 "D1:Edit" 권한을 추가할 것.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

jobs:
  d1-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export bnhd-v2 --remote --output bnhd-v2-backup.sql
          ls -la bnhd-v2-backup.sql
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: bnhd-v2-backup.sql
          retention-days: 30
