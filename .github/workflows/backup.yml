name: backup

# 프로덕션 D1 자동 백업 — 매일 04:17 KST (19:17 UTC) SQL 덤프를 GitHub Actions
# artifact(비공개 리포, 30일 보관)로 남긴다. 복구 절차는 README 운영 섹션 참고.
# 참고: D1 자체의 Time Travel(30일 시점 복구)이 1차 안전망이고 이 덤프는 오프사이트 2차 백업.
#
# CLOUDFLARE_API_TOKEN에 "D1:Edit" 권한이 없으면 export가 Authentication error [code: 10000]로
# 실패한다. 실제로 도입(2026-07-12)부터 v1.2.0 승격까지 18회 연속 실패했는데, 스케줄 잡의
# 실패는 아무도 보지 않아 그동안 2차 백업이 없는 줄 몰랐다 — 그래서 아래 두 장치를 뒀다.
#   ① 덤프를 업로드하기 전에 내용을 검사한다 (빈 파일·잘린 덤프를 성공으로 넘기지 않는다)
#   ② 실패하면 이슈를 열어 눈에 보이게 만든다 (이미 열려 있으면 중복 생성하지 않는다)
# export 중 몇 초간 D1이 쿼리를 받지 못한다 — 트래픽이 가장 적은 새벽에 도는 이유다.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  d1-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Export production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export bnhd-v2 --remote --output bnhd-v2-backup.sql

      # wrangler가 0으로 끝나도 덤프가 비었거나 잘렸을 수 있다. 복구에 실제로 필요한
      # 테이블이 다 들어 있는지 보고, 없으면 여기서 실패시킨다 — 쓸모없는 artifact를
      # 30일간 "백업이 있다"고 착각하며 보관하는 것이 더 위험하다.
      - name: Verify dump
        run: |
          set -euo pipefail
          test -s bnhd-v2-backup.sql || { echo "덤프가 비어 있다"; exit 1; }
          for t in users beans logos sessions auth_attempts r2_usage; do
            grep -qE "^CREATE TABLE (IF NOT EXISTS )?\"?${t}\"?" bnhd-v2-backup.sql \
              || { echo "덤프에 ${t} 테이블이 없다 — 잘렸거나 스키마가 바뀌었다"; exit 1; }
          done
          echo "덤프 정상 — $(wc -c < bnhd-v2-backup.sql) bytes / $(grep -c '^INSERT INTO' bnhd-v2-backup.sql) INSERT"

      - uses: actions/upload-artifact@v7
        with:
          name: d1-backup-${{ github.run_id }}
          path: bnhd-v2-backup.sql
          retention-days: 30

      # 스케줄 잡의 실패는 Actions 탭에 빨간불만 남기고 지나간다. 백업은 깨진 걸
      # 모르는 것이 곧 손실이므로, 실패를 이슈로 올려 읽히게 만든다.
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="D1 자동 백업 실패 — 오프사이트 2차 백업이 없는 상태"
          # 이미 열려 있으면 다시 만들지 않는다 — 매일 도는 잡이라 중복이 쌓인다.
          if [ -n "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')" ]; then
            echo "이미 열린 이슈가 있다 — 생성 생략"
            exit 0
          fi
          # 아래 본문은 YAML 블록 스칼라 안이라 스크립트와 같은 깊이로 들여쓴다 —
          # YAML이 공통 들여쓰기를 벗겨내므로 셸에는 컬럼 0으로 전달된다.
          cat > issue-body.md <<EOF
          \`backup.yml\`이 실패했다. **오프사이트 2차 백업이 만들어지지 않고 있다.**

          - 실패한 실행: $RUN_URL
          - 1차 안전망인 **D1 Time Travel(30일)** 은 이 잡과 무관하게 살아 있다 — 즉시 위험은
            아니지만, 30일을 넘긴 시점 복구는 불가능해진다.

          ## 먼저 볼 것

          로그에 \`Authentication error [code: 10000]\`이 있으면 \`CLOUDFLARE_API_TOKEN\`의 권한
          문제다 — 토큰에 **D1:Edit** 를 추가하면 해결된다 (export는 읽기처럼 보이지만 D1 Edit를
          요구한다).

          그 외라면 덤프 검증 단계에서 걸렸을 수 있다. 테이블이 빠졌다는 메시지면 스키마가 바뀐
          것이므로 이 워크플로의 검증 목록도 함께 갱신한다.

          ## 고친 뒤

          Actions 탭에서 \`backup\` 워크플로를 \`workflow_dispatch\`로 한 번 돌려 artifact가
          생기는지 확인하고 이 이슈를 닫는다.
          EOF
          gh issue create --title "$TITLE" --body-file issue-body.md
