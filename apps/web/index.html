<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f4f5">
<!-- 저장된 테마를 첫 페인트 전에 적용 (깜빡임 방지라 블로킹 인라인 — 세 진입점에 같은 사본) -->
<script>
  try {
    if (localStorage.getItem("bh_theme") === "dark") {
      document.documentElement.dataset.theme = "dark";
      document.querySelector('meta[name="theme-color"]').content = "#0a0a0b";
    }
  } catch (_e) {}
</script>
<title>BEAN-HOARDER — 원두 조회</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cellipse cx='24' cy='24' rx='14' ry='19' fill='%23f04e1c' transform='rotate(20 24 24)'/%3E%3Cpath d='M18 8C28 18 20 30 30 40' stroke='%23ffffff' stroke-width='4' fill='none' transform='rotate(20 24 24)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/theme.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh; padding: 22px 16px 32px; }
  /* 카드를 세로 40% 지점에 — 정확히 가운데보다 살짝 위가 시선에 안정적이다.
     위:아래 = 2:3 스페이서로 남는 공간을 나눈다. 콘텐츠가 화면보다 길어지면 스페이서가 0으로
     줄어들어 그냥 아래로 자란다 — 가운데 정렬에서 흔한 "위가 잘리는" 문제가 생기지 않는다. */
  main { width: 100%; max-width: 430px; flex: 1; display: flex; flex-direction: column; }
  main::before { content: ""; flex: 2; }
  main::after { content: ""; flex: 3; }
  .brand {
    display: inline-block; font-family: var(--display); font-weight: 700; font-size: 12px;
    letter-spacing: .22em; color: var(--sub); text-decoration: none; margin: 0 0 14px 2px;
  }
  footer { margin-top: 28px; font-size: 11px; letter-spacing: .08em; color: var(--sub); }

  /* ---- 보딩패스 카드: 아이덴티티 밴드 / 티켓 정보 행 / 절취 스텁 (DESIGN.md §7) ----
     항공권의 구조를 그대로 옮긴다 — 상단 밴드가 노선(원두 정체성)을, 중단 티켓 행이
     게이트/좌석(날짜·용량·로스팅), 절취선 아래 스텁이 티켓 번호(KEY)를 맡는다.
     향미 그라데이션은 밴드의 배경으로만(저알파, viewer.ts가 얹음) — 텍스트 대비 불가침. */
  .pass {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden;
  }
  .pass-band { padding: 20px 22px 16px; background-color: var(--surface-2); }
  .band-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .origin-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .band-roastery {
    font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink); opacity: .78;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  h1.origin {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(28px, 7.6vw, 36px); line-height: 1.06;
    letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance;
  }
  .subline { margin: 8px 0 0; font-size: 14px; color: var(--sub); font-weight: 500; }
  .subline .sep { padding: 0 5px; }

  .pass-main { padding: 16px 22px 20px; }
  .preview-badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em;
    color: var(--sub); border: 1px solid var(--line); border-radius: var(--radius-pill);
    padding: 2px 10px; margin-bottom: 12px;
  }
  ul.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 4px; padding: 0; }
  ul.chips li {
    font-size: 12.5px; font-weight: 500; padding: 3.5px 11px; border-radius: var(--radius-pill);
    border: 1px solid var(--line); color: var(--ink);
  }
  .note { margin: 0 0 4px; font-style: italic; font-size: 14px; }

  /* 티켓 정보 행 — GATE/SEAT처럼 핵심 수치(날짜·용량·로스팅포인트)를 한 행의 mono 컬럼으로 */
  dl.ticket-row {
    display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 14px 0 0;
    padding-top: 14px; border-top: 1px solid var(--line);
  }
  dl.ticket-row > div { display: flex; flex-direction: column; min-width: 0; }
  dt { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--sub); }
  dl.ticket-row dd { margin: 3px 0 0; font-family: var(--mono); font-size: 15px; font-weight: 700; }
  /* 부가 스펙(가공·품종·고도…)은 행이 아니라 한 줄 텍스트로 — 티켓 행과 위계를 가른다 */
  .specline { margin: 12px 0 0; font-size: 12.5px; color: var(--sub); line-height: 1.7; }
  .specline b { color: var(--ink); font-weight: 600; }
  /* 라벨+값을 한 덩어리로 — 줄바꿈은 항목과 항목 사이(·)에서만 일어난다 */
  .spec-pair { white-space: nowrap; }
  .specline .sep { padding: 0 6px; }

  /* 절취선 + 노치 */
  .perf { position: relative; height: 22px; }
  .perf::before { content: ""; position: absolute; left: 26px; right: 26px; top: 10px; border-top: 2px dashed var(--line); }
  .perf i { position: absolute; top: 1px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
  .perf i:first-child { left: -10px; }
  .perf i:last-child { right: -10px; }

  /* 스텁 — 티켓 번호(KEY)·경과일·원본 링크. 브랜드는 카드 밖 푸터가 맡는다 */
  .pass-stub { padding: 2px 22px 18px; }
  .stub-row { display: flex; align-items: center; gap: 12px; }
  .stub-key { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .06em; }
  .dday {
    margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-weight: 700;
    color: var(--sub); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 2px 10px;
  }
  .stub-row .srclink { font-size: 12.5px; font-weight: 600; text-decoration: none; }
  .stub-row .srclink:hover { text-decoration: underline; }
  .memo { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .memo-label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--sub); margin-bottom: 3px; }
  .memo-body { font-size: 13.5px; }

  /* ---- 상태 / 랜딩 ---- */
  .status { text-align: center; padding: 52px 22px; color: var(--sub); font-size: 14px; }
  .status .code { font-family: var(--mono); color: var(--ink); }

  .landing { text-align: center; padding: 40px 26px 32px; }
  .beanmark { width: 42px; height: 42px; color: var(--accent); margin-bottom: 10px; }
  .landing h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .01em; }
  .landing .tagline { margin: 10px 0 22px; font-size: 14px; color: var(--sub); }
  #code-form { display: flex; gap: 8px; }
  #code-form input { font-family: var(--mono); text-transform: uppercase; }
  #code-form button { white-space: nowrap; flex-shrink: 0; }
  /* 보조 링크는 색이 아니라 밑줄로 링크임을 보인다 — accent를 나란히 세 번 쓰지 않는다 */
  .landing-links { margin-top: 18px; font-size: 13px; color: var(--sub); }
  .landing-links a {
    color: var(--ink); font-weight: 500;
    text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px;
  }
  .landing-links a:hover { text-decoration-color: var(--ink); }

  /* ---- 카메라 QR 스캔 ---- */
  /* 보조 동선이므로 accent를 쓰지 않는다 — 주 동선(조회 버튼)과 경쟁하지 않게 중립 보더로 */
  /* 조회 입력 옆 아이콘 버튼 — 보조 동선이라 이름표 없이. 노출 자체가 터치 기기 한정(viewer.ts) */
  .scan-btn {
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; width: 40px; padding: 0;
    border: 1px solid var(--line); color: var(--sub); background: var(--surface);
    border-radius: var(--radius-sm);
  }
  .scan-btn:hover { border-color: var(--ink); color: var(--ink); }
  .scanner {
    position: fixed; inset: 0; z-index: 1000; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .scanner-inner { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #scan-video { width: 100%; height: 100%; object-fit: cover; }
  .scan-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(66vw, 260px); aspect-ratio: 1; border-radius: var(--radius);
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5); border: 2px solid rgba(255, 255, 255, .9);
  }
  .scan-hint {
    position: absolute; left: 0; right: 0; bottom: 92px; text-align: center;
    color: #fff; font-size: 14px; padding: 0 24px; text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .scan-close {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: var(--radius-pill); padding: 10px 22px; font-size: 14px; font-weight: 600; backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
<main>
  <a class="brand" href="/" id="top-brand">BEAN-HOARDER</a>

  <div id="status" class="card status">불러오는 중…</div>

  <div id="landing" class="card landing hidden">
    <svg class="beanmark" viewBox="0 0 48 48" aria-hidden="true">
      <ellipse cx="24" cy="24" rx="14" ry="19" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(20 24 24)"/>
      <path d="M18 8C28 18 20 30 30 40" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(20 24 24)"/>
    </svg>
    <h1>Bean-Hoarder</h1>
    <p class="tagline">여러 로스터리에서 사 모은 원두를 소분하고,<br>QR 라벨 하나로 정보를 다시 꺼내 봅니다.</p>
    <form id="code-form">
      <input id="code-input" type="text" placeholder="DEMO26-001" autocomplete="off" spellcheck="false">
      <!-- 카메라는 손에 든 기기에서만 의미가 있다 — 노출 판단은 viewer.ts(터치 + getUserMedia) -->
      <button id="scan-btn" class="scan-btn hidden" type="button" aria-label="카메라로 QR 스캔" title="카메라로 QR 스캔">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/>
        </svg>
      </button>
      <button class="primary" type="submit">조회</button>
    </form>
    <div class="landing-links">
      <a href="/demo">데모 둘러보기</a> &nbsp;·&nbsp; <a href="/deck">내 원두 덱</a> &nbsp;·&nbsp; <a href="/lab">랩 (등록·QR 발급)</a>
    </div>
  </div>

  <div id="scanner" class="scanner hidden">
    <div class="scanner-inner">
      <video id="scan-video" playsinline muted></video>
      <div class="scan-frame"></div>
      <canvas id="scan-canvas" class="hidden"></canvas>
      <div class="scan-hint" id="scan-hint">라벨의 QR을 사각형 안에 맞춰 주세요</div>
      <button id="scan-close" class="scan-close" type="button" aria-label="닫기">✕ 닫기</button>
    </div>
  </div>

  <article id="bean" class="pass hidden">
    <header class="pass-band" id="f-band">
      <div class="band-meta">
        <span class="origin-swatch hidden" id="f-origin-swatch"></span>
        <span class="band-roastery" id="f-roastery"></span>
      </div>
      <!-- biome-ignore lint/a11y/useHeadingContent: 내용은 render()가 채운다 (조회 결과가 와야 제목이 정해짐) -->
      <h1 class="origin" id="f-origin"></h1>
      <p class="subline hidden" id="f-subline"></p>
    </header>
    <div class="pass-main">
      <div id="f-preview-badge" class="preview-badge hidden"></div>
      <ul class="chips hidden" id="f-chips"></ul>
      <div class="note hidden" id="f-note"></div>
      <dl class="ticket-row" id="f-ticket">
        <div id="f-roasted-box" class="hidden"><dt>RSTD</dt><dd id="f-roasted"></dd></div>
        <div id="f-packed-box" class="hidden"><dt>PKGD</dt><dd id="f-packed"></dd></div>
        <div id="f-net-box" class="hidden"><dt>NET</dt><dd id="f-net"></dd></div>
        <div id="f-roastpt-box" class="hidden"><dt>ROAST PT</dt><dd id="f-roastpt"></dd></div>
      </dl>
      <p class="specline hidden" id="f-specline"></p>
    </div>
    <div class="perf"><i></i><i></i></div>
    <div class="pass-stub">
      <div class="stub-row">
        <span class="stub-key" id="f-key"></span>
        <span class="dday hidden" id="f-dday"></span>
        <!-- biome-ignore lint/a11y/useValidAnchor: href는 render()가 원두의 SOURCE_URL로 채운다 -->
        <a id="f-source" class="srclink hidden" target="_blank" rel="noopener">원본 ↗</a>
      </div>
      <div class="memo hidden" id="f-memo">
        <div class="memo-label">OTHER INFO</div>
        <div class="memo-body" id="f-memo-body"></div>
      </div>
    </div>
  </article>
</main>
<footer>BEAN-HOARDER — 원두 소분 라벨 아카이브</footer>

<script type="module" src="/src/viewer.ts"></script>
</body>
</html>
