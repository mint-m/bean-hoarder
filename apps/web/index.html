<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<title>BEAN-HOARDER — 원두 조회</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cellipse cx='24' cy='24' rx='14' ry='19' fill='%23f04e1c' transform='rotate(20 24 24)'/%3E%3Cpath d='M18 8C28 18 20 30 30 40' stroke='%23ffffff' stroke-width='4' fill='none' transform='rotate(20 24 24)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/theme.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh; padding: 22px 16px 32px; }
  main { width: 100%; max-width: 430px; flex: 1; }
  .brand {
    display: inline-block; font-family: var(--display); font-weight: 700; font-size: 12px;
    letter-spacing: .22em; color: var(--sub); text-decoration: none; margin: 0 0 14px 2px;
  }
  footer { margin-top: 28px; font-size: 11px; letter-spacing: .08em; color: var(--sub); }

  /* ---- 보딩패스 카드 ---- */
  .pass {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    border-top: 6px solid var(--accent); overflow: hidden;
  }
  .pass-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 22px 0;
  }
  .pass-brand {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .2em; color: var(--sub);
  }
  .pass-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .pass-key { font-family: var(--mono); font-size: 12.5px; font-weight: 700; letter-spacing: .06em; }

  .pass-main { padding: 18px 22px 22px; }
  .preview-badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px;
  }
  .eyebrow {
    font-size: 11.5px; font-weight: 700; letter-spacing: .2em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
  }
  h1.origin {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(32px, 9vw, 42px); line-height: 1.02;
    letter-spacing: .01em; text-transform: uppercase; text-wrap: balance;
  }
  .subline { margin: 8px 0 0; font-size: 14px; color: var(--sub); font-weight: 500; }
  .subline .sep { padding: 0 5px; }

  ul.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; }
  ul.chips li {
    font-size: 12.5px; font-weight: 600; padding: 3.5px 11px; border-radius: var(--radius-pill);
    border: 1px solid var(--ink); color: var(--ink);
  }
  .note { margin: 16px 0 0; font-style: italic; font-size: 14px; }

  dl.specs { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 18px; margin: 20px 0 0; }
  dl.specs > div { display: flex; flex-direction: column; min-width: 0; }
  dt { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--sub); }
  dd { margin: 2px 0 0; font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }

  /* 절취선 + 노치 */
  .perf { position: relative; height: 22px; }
  .perf::before { content: ""; position: absolute; left: 26px; right: 26px; top: 10px; border-top: 2px dashed var(--line); }
  .perf i { position: absolute; top: 1px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
  .perf i:first-child { left: -10px; }
  .perf i:last-child { right: -10px; }

  .pass-stub { padding: 4px 22px 20px; }
  .stub-grid { display: flex; align-items: center; gap: 22px; margin: 0; }
  /* biome-ignore lint/style/noDescendingSpecificity: 기존 캐스케이드 — 순서를 바꾸면 표시가 달라질 수 있어 이전 단계에서 건드리지 않는다 */
  .stub-grid > div { display: flex; flex-direction: column; }
  .stub-grid dd { margin: 2px 0 0; font-family: var(--mono); font-size: 13.5px; font-weight: 700; }
  .dday {
    margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); border-radius: var(--radius-pill); padding: 3px 11px;
  }
  .memo { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .memo-label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--sub); margin-bottom: 3px; }
  .memo-body { font-size: 13.5px; }
  .srcline { margin-top: 14px; font-size: 12.5px; }
  .srcline a { font-weight: 600; text-decoration: none; }
  .srcline a:hover { text-decoration: underline; }

  /* ---- 상태 / 랜딩 ---- */
  .status { text-align: center; padding: 52px 22px; color: var(--sub); font-size: 14px; }
  .status .code { font-family: var(--mono); color: var(--ink); }

  .landing { text-align: center; padding: 40px 26px 32px; border-top: 6px solid var(--accent); border-left: 0; border-right: 0; border-bottom: 0; }
  .beanmark { width: 42px; height: 42px; color: var(--accent); margin-bottom: 10px; }
  .landing h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .01em; }
  .landing .tagline { margin: 10px 0 22px; font-size: 14px; color: var(--sub); }
  #code-form { display: flex; gap: 8px; }
  #code-form input { font-family: var(--mono); text-transform: uppercase; }
  #code-form button { white-space: nowrap; flex-shrink: 0; }
  .landing-links { margin-top: 18px; font-size: 13px; color: var(--sub); }
  .landing-links a { text-decoration: none; font-weight: 600; }
  .landing-links a:hover { text-decoration: underline; }

  /* ---- 카메라 QR 스캔 ---- */
  .scan-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    margin-top: 10px; width: 100%; padding: 11px 14px;
    border: 1px solid var(--accent); color: var(--accent); background: var(--surface);
    border-radius: 11px; font-size: 14px; font-weight: 600;
  }
  .scan-btn:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .scanner {
    position: fixed; inset: 0; z-index: 1000; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .scanner-inner { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #scan-video { width: 100%; height: 100%; object-fit: cover; }
  .scan-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(66vw, 260px); aspect-ratio: 1; border-radius: 18px;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5); border: 2px solid rgba(255, 255, 255, .9);
  }
  .scan-hint {
    position: absolute; left: 0; right: 0; bottom: 92px; text-align: center;
    color: #fff; font-size: 14px; padding: 0 24px; text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .scan-close {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: var(--radius-pill); padding: 10px 22px; font-size: 14px; font-weight: 600; backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
<main>
  <a class="brand" href="/" id="top-brand">BEAN-HOARDER</a>

  <div id="status" class="card status">불러오는 중…</div>

  <div id="landing" class="card landing hidden">
    <svg class="beanmark" viewBox="0 0 48 48" aria-hidden="true">
      <ellipse cx="24" cy="24" rx="14" ry="19" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(20 24 24)"/>
      <path d="M18 8C28 18 20 30 30 40" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(20 24 24)"/>
    </svg>
    <h1>Bean-Hoarder</h1>
    <p class="tagline">여러 로스터리에서 사 모은 원두를 소분하고,<br>QR 라벨 하나로 정보를 다시 꺼내 봅니다.</p>
    <form id="code-form">
      <input id="code-input" type="text" placeholder="라벨 코드 (예: DEMO26-001)" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit">조회</button>
    </form>
    <button id="scan-btn" class="scan-btn hidden" type="button">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/>
      </svg>
      카메라로 QR 스캔
    </button>
    <div class="landing-links">
      <a href="/DEMO26-001">데모 원두</a> &nbsp;·&nbsp; <a href="/deck">내 원두 덱</a> &nbsp;·&nbsp; <a href="/admin">랩 (등록·관리)</a>
    </div>
  </div>

  <div id="scanner" class="scanner hidden">
    <div class="scanner-inner">
      <video id="scan-video" playsinline muted></video>
      <div class="scan-frame"></div>
      <canvas id="scan-canvas" class="hidden"></canvas>
      <div class="scan-hint" id="scan-hint">라벨의 QR을 사각형 안에 맞춰 주세요</div>
      <button id="scan-close" class="scan-close" type="button" aria-label="닫기">✕ 닫기</button>
    </div>
  </div>

  <article id="bean" class="pass hidden">
    <header class="pass-head">
      <span class="pass-brand"><span class="dot"></span>BEAN-HOARDER</span>
      <span class="pass-key" id="f-key"></span>
    </header>
    <div class="pass-main">
      <div id="f-preview-badge" class="preview-badge hidden"></div>
      <div class="eyebrow" id="f-roastery"></div>
      <!-- biome-ignore lint/a11y/useHeadingContent: 내용은 render()가 채운다 (조회 결과가 와야 제목이 정해짐) -->
      <h1 class="origin" id="f-origin"></h1>
      <p class="subline hidden" id="f-subline"></p>
      <ul class="chips hidden" id="f-chips"></ul>
      <div class="note hidden" id="f-note"></div>
      <dl class="specs" id="f-specs"></dl>
    </div>
    <div class="perf"><i></i><i></i></div>
    <div class="pass-stub">
      <dl class="stub-grid">
        <div id="f-roasted-box" class="hidden"><dt>ROASTED</dt><dd id="f-roasted"></dd></div>
        <div id="f-packed-box" class="hidden"><dt>PACKED</dt><dd id="f-packed"></dd></div>
        <div id="f-net-box" class="hidden"><dt>NET</dt><dd id="f-net"></dd></div>
        <span class="dday hidden" id="f-dday"></span>
      </dl>
      <div class="memo hidden" id="f-memo">
        <div class="memo-label">OTHER INFO</div>
        <div class="memo-body" id="f-memo-body"></div>
      </div>
      <div class="srcline hidden" id="f-srcline">
        <!-- biome-ignore lint/a11y/useValidAnchor: href는 render()가 원두의 SOURCE_URL로 채운다 -->
        <a id="f-source" target="_blank" rel="noopener">원본 페이지 ↗</a>
      </div>
    </div>
  </article>
</main>
<footer>BEAN-HOARDER — 원두 소분 라벨 아카이브</footer>

<script type="module" src="/src/viewer.ts"></script>
</body>
</html>
