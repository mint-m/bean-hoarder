<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BEAN-HOARDER — LAB</title>
<meta name="theme-color" content="#f4f4f5">
<!-- 저장된 테마를 첫 페인트 전에 적용한다. 깜빡임을 막으려면 블로킹 인라인이어야 해서
     세 진입점(조회·덱·랩)에 같은 사본을 둔다 — 기본은 라이트, 다크는 설정에서 켠 사람만. -->
<script>
  try {
    if (localStorage.getItem("bh_theme") === "dark") {
      document.documentElement.dataset.theme = "dark";
      document.querySelector('meta[name="theme-color"]').content = "#0a0a0b";
    }
  } catch (_e) {}
</script>
<!-- theme.css의 --display가 첫 순위로 두는 서체다. 여기만 안 실으면 워드마크가 본문 서체로
     폴백돼 브랜드 타이포가 표면마다 달라진다 — 조회·덱과 같은 세 줄을 그대로 둔다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/lab.css">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
