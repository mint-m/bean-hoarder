<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16100a" media="(prefers-color-scheme: dark)">
<title>BEAN-HOARDER — 원두 조회</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cellipse cx='24' cy='24' rx='14' ry='19' fill='%238b5e34' transform='rotate(20 24 24)'/%3E%3Cpath d='M18 8C28 18 20 30 30 40' stroke='%23f4eee4' stroke-width='4' fill='none' transform='rotate(20 24 24)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/theme.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh; padding: 22px 16px 32px; }
  main { width: 100%; max-width: 440px; flex: 1; }
  .brand {
    display: inline-block; font-family: var(--display); font-weight: 800; font-size: 13px;
    letter-spacing: .22em; color: var(--sub); text-decoration: none; margin: 0 0 14px 2px;
  }
  footer { margin-top: 28px; font-size: 11px; letter-spacing: .08em; color: var(--sub); }

  /* ---- 원두 카드 ---- */
  .bean { padding: 30px 26px 24px; }
  .preview-badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold); border-bottom: 1px dashed var(--line); padding-bottom: 12px; margin-bottom: 16px;
  }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: .2em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
  }
  h1.origin {
    margin: 0; font-family: var(--display); font-weight: 800;
    font-size: clamp(34px, 9.5vw, 44px); line-height: 1.04;
    letter-spacing: .005em; text-transform: uppercase; text-wrap: balance;
  }
  .subline { margin: 10px 0 0; font-size: 14.5px; color: var(--ink); }
  .subline .sep { color: var(--sub); padding: 0 5px; }

  ul.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; }
  ul.chips li {
    font-size: 12.5px; padding: 3.5px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  }
  .note { margin: 16px 0 0; font-style: italic; font-size: 14px; color: var(--ink); }

  hr.strong { border: 0; border-top: 1.5px solid var(--ink); margin: 20px 0 14px; }

  .freshline {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    font-size: 13px; font-family: var(--mono); color: var(--ink); margin-bottom: 14px;
  }
  .freshline .sep { color: var(--sub); padding: 0 5px; }
  .freshline .dday {
    font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); margin-left: 4px;
  }

  dl.specs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin: 0; }
  dl.specs > div { display: flex; flex-direction: column; min-width: 0; }
  dt { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--sub); }
  dd { margin: 2px 0 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }

  .memo { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .memo-label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--sub); margin-bottom: 3px; }
  .memo-body { font-size: 14px; }

  .keyline {
    margin-top: 22px; display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 12px; color: var(--sub);
  }
  .keyline a { color: var(--accent); text-decoration: none; }
  .keyline a:hover { text-decoration: underline; }

  /* ---- 상태 / 랜딩 ---- */
  .status { text-align: center; padding: 52px 22px; color: var(--sub); font-size: 14px; }
  .status .code { font-family: var(--mono); color: var(--ink); }
  .status a { color: var(--accent); }

  .landing { text-align: center; padding: 40px 26px 32px; }
  .beanmark { width: 44px; height: 44px; color: var(--accent); margin-bottom: 10px; }
  .landing h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .01em; }
  .landing .tagline { margin: 10px 0 22px; font-size: 14px; color: var(--sub); }
  #code-form { display: flex; gap: 8px; }
  #code-form input { font-family: var(--mono); text-transform: uppercase; }
  #code-form button { white-space: nowrap; flex-shrink: 0; }
  .landing-links { margin-top: 18px; font-size: 13px; color: var(--sub); }
  .landing-links a { text-decoration: none; font-weight: 600; }
  .landing-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <a class="brand" href="/">BEAN-HOARDER</a>

  <div id="status" class="card status">불러오는 중…</div>

  <div id="landing" class="card landing hidden">
    <svg class="beanmark" viewBox="0 0 48 48" aria-hidden="true">
      <ellipse cx="24" cy="24" rx="14" ry="19" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(20 24 24)"/>
      <path d="M18 8C28 18 20 30 30 40" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(20 24 24)"/>
    </svg>
    <h1>Bean-Hoarder</h1>
    <p class="tagline">여러 로스터리에서 사 모은 원두를 소분하고,<br>QR 라벨 하나로 정보를 다시 꺼내 봅니다.</p>
    <form id="code-form">
      <input id="code-input" type="text" placeholder="라벨 코드 (예: DEMO26-001)" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit">조회</button>
    </form>
    <div class="landing-links">
      <a href="/DEMO26-001">데모 원두 보기</a> &nbsp;·&nbsp; <a href="/admin">스튜디오 (등록·관리)</a>
    </div>
  </div>

  <article id="bean" class="card bean hidden">
    <div id="f-preview-badge" class="preview-badge hidden"></div>
    <div class="eyebrow" id="f-roastery"></div>
    <h1 class="origin" id="f-origin"></h1>
    <p class="subline hidden" id="f-subline"></p>
    <ul class="chips hidden" id="f-chips"></ul>
    <div class="note hidden" id="f-note"></div>
    <hr class="strong">
    <div class="freshline hidden" id="f-fresh"></div>
    <dl class="specs" id="f-specs"></dl>
    <div class="memo hidden" id="f-memo">
      <div class="memo-label">MEMO</div>
      <div class="memo-body" id="f-memo-body"></div>
    </div>
    <div class="keyline">
      <span id="f-key"></span>
      <a id="f-source" class="hidden" target="_blank" rel="noopener">원본 페이지 ↗</a>
    </div>
  </article>
</main>
<footer>BEAN-HOARDER — 원두 소분 라벨 아카이브</footer>

<script>
const KEY_RE = /^[A-Z0-9]{4}\d{2}-\d{3}$/;
// 지역·생산자는 서브라인, 날짜는 프레시라인에 표시하므로 스펙 그리드에서 제외
const SPEC_FIELDS = [
  ["PROCESS", "PROCESS"], ["VARIETY", "VARIETY"], ["AGTRON", "ROAST PT"],
  ["NET_WEIGHT", "NET"], ["ALTITUDE", "ALTITUDE"], ["HARVEST", "HARVEST"], ["LOT", "LOT"],
];

function getCode() {
  const q = new URLSearchParams(location.search).get("c");
  if (q) return q.trim().toUpperCase();
  const path = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "");
  return path && path !== "index.html" ? path.toUpperCase() : null;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function hideAll() {
  ["status", "landing", "bean"].forEach(id => document.getElementById(id).classList.add("hidden"));
}
function show(msg) {
  hideAll();
  const el = document.getElementById("status");
  el.innerHTML = msg;
  el.classList.remove("hidden");
}
function showLanding() {
  hideAll();
  document.getElementById("landing").classList.remove("hidden");
  const form = document.getElementById("code-form");
  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("code-input").value.trim().toUpperCase();
    if (v) location.href = "/" + encodeURIComponent(v);
  });
}

function parseDot(d) {
  const m = /^(\d{2})\.(\d{2})\.(\d{2})$/.exec(d || "");
  return m ? new Date(2000 + +m[1], +m[2] - 1, +m[3]) : null;
}

function render(row, isPreview) {
  const g = k => (row[k] || "").trim();
  hideAll();
  document.getElementById("bean").classList.remove("hidden");

  const badge = document.getElementById("f-preview-badge");
  badge.classList.toggle("hidden", !isPreview);
  if (isPreview) badge.textContent = "초안 미리보기 · 아직 등록되지 않음";

  document.getElementById("f-roastery").textContent = g("ROASTERY");
  document.getElementById("f-origin").textContent = g("ORIGIN");

  const subParts = [g("REGION"), g("PRODUCER")].filter(Boolean);
  const sub = document.getElementById("f-subline");
  sub.classList.toggle("hidden", !subParts.length);
  sub.innerHTML = subParts.map(v => `<span>${escapeHtml(v)}</span>`).join('<span class="sep">·</span>');

  // 테이스팅 노트: 짧은 항목들이면 칩으로, 긴 문장이면 이탤릭 문단으로
  const chips = document.getElementById("f-chips");
  const note = document.getElementById("f-note");
  chips.classList.add("hidden"); note.classList.add("hidden");
  const noteRaw = g("TASTING_NOTE");
  if (noteRaw) {
    const segs = noteRaw.split(/[,·]/).map(s => s.trim()).filter(Boolean);
    if (segs.length && segs.every(s => s.length <= 28)) {
      chips.innerHTML = segs.map(s => `<li>${escapeHtml(s)}</li>`).join("");
      chips.classList.remove("hidden");
    } else {
      note.textContent = noteRaw;
      note.classList.remove("hidden");
    }
  }

  // 로스팅/소분 날짜 + D+N
  const fresh = document.getElementById("f-fresh");
  const rd = g("ROAST_DATE"), pd = g("PACKAGE_DATE");
  fresh.classList.toggle("hidden", !rd && !pd);
  const parts = [];
  if (rd) {
    const d = parseDot(rd);
    const n = d ? Math.floor((Date.now() - d.getTime()) / 864e5) : null;
    parts.push(`로스팅 ${escapeHtml(rd)}${n != null && n >= 0 && !isPreview ? `<span class="dday">D+${n}</span>` : ""}`);
  }
  if (pd) parts.push(`소분 ${escapeHtml(pd)}`);
  fresh.innerHTML = parts.join('<span class="sep">·</span>');

  const dl = document.getElementById("f-specs");
  dl.innerHTML = "";
  for (const [col, label] of SPEC_FIELDS) {
    const v = g(col);
    if (!v) continue;
    const div = document.createElement("div");
    div.innerHTML = `<dt>${label}</dt><dd>${escapeHtml(v)}</dd>`;
    dl.appendChild(div);
  }

  const memo = document.getElementById("f-memo");
  memo.classList.toggle("hidden", !g("MEMO"));
  if (g("MEMO")) document.getElementById("f-memo-body").textContent = g("MEMO");

  document.getElementById("f-key").textContent = g("KEY");
  const src = document.getElementById("f-source");
  src.classList.toggle("hidden", !g("SOURCE_URL"));
  if (g("SOURCE_URL")) src.href = g("SOURCE_URL");

  document.title = `${g("ORIGIN")} — BEAN-HOARDER${isPreview ? " (미리보기)" : ""}`;
}

function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split("").map(c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join(""));
}

async function main() {
  const previewParam = new URLSearchParams(location.search).get("preview");
  if (previewParam) {
    try {
      render(JSON.parse(b64DecodeUnicode(previewParam)), true);
    } catch (e) {
      show("미리보기 데이터를 해석하지 못했습니다.");
    }
    return;
  }
  const code = getCode();
  if (!code) { showLanding(); return; }
  if (!KEY_RE.test(code)) {
    show(`올바른 코드 형식이 아닙니다.<br><span class="code">${escapeHtml(code)}</span><br><br><a href="/">처음으로 ←</a>`);
    return;
  }
  let res;
  try {
    res = await fetch(`/api/bean/${encodeURIComponent(code)}`, { cache: "no-store" });
  } catch (e) {
    show("데이터를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.");
    return;
  }
  if (res.status === 404) {
    show(`등록되지 않은 코드입니다.<br><span class="code">${escapeHtml(code)}</span><br><br><a href="/">처음으로 ←</a>`);
    return;
  }
  if (!res.ok) {
    show("데이터를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.");
    return;
  }
  const { bean } = await res.json();
  render(bean, false);
}
main();
</script>
</body>
</html>
