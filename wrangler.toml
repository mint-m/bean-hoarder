name = "bnhd"
compatibility_date = "2026-05-03"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "bnhd-v2"
database_id = "f6b539d0-3394-4011-9f00-f3961d549409"

# INVITE_CODE는 저장소에 커밋하지 않는다 — Cloudflare secret으로 관리:
#   npx wrangler pages secret put INVITE_CODE
# (교체도 같은 명령으로. 대시보드 Settings > Environment variables에서도 가능)

# DEMO_ADMIN_KEY도 같은 방식의 secret — 공개된 DEMO 계정에서 쓰기를 여는 관리자 키다.
#   npx wrangler pages secret put DEMO_ADMIN_KEY
# 설정하지 않으면 기능이 꺼진 채로 DEMO는 순수 읽기 전용이 된다.

[[r2_buckets]]
binding = "LOGOS"
bucket_name = "bnhd-logos"
